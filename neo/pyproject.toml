[project]
name = "neo"
version = "0.1.6"
description = "Local autonomous agent harness — shell and Python on your machine"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "openai>=1.82",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "prompt-toolkit>=3.0",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
local = [
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.23.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
neo = "main:cli"
llm = "llm:main"

[tool.setuptools]
py-modules = ["main", "llm", "settings"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
