[project]
name = "goodboy"
version = "0.1.0"
description = "Local autonomous agent harness — shell and Python on your machine"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "openai>=1.82",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
goodboy = "main:cli"
llm = "llm:main"

[tool.setuptools]
py-modules = ["main", "llm", "settings"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
