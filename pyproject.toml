[project]
name = "goodboy"
version = "0.1.0"
description = "Hello World Python project"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "openai>=1.82",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.scripts]
goodboy = "main:cli"
llm = "llm:main"

[tool.setuptools]
py-modules = ["main", "llm", "settings"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
